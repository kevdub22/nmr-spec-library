[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "public/assets/background.png",
    "public/assets/nmr-stacked.png",
    "public/assets/fonts/InstrumentSans-Medium.ttf",
    "public/assets/fonts/InstrumentSans-SemiBold.ttf",
    "public/assets/fonts/InstrumentSans-Bold.ttf",
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
