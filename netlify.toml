[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "public/assets/background.png",
    "public/assets/nmr-stacked.png",
    "public/assets/fonts/InstrumentSans-Medium.ttf",
    "public/assets/fonts/InstrumentSans-SemiBold.ttf",
    "public/assets/fonts/InstrumentSans-Bold.ttf",
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# A stale service worker is sticky — it keeps controlling the page and can mask
# a deploy — so it must always be revalidated. Same for the manifest, and the
# explicit content type avoids relying on .webmanifest MIME detection.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
